<body>
  <div id="root" data-composition-id="clean-air-motion-output" data-no-timeline data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920" data-fps="30">
    <div class="ambient" data-layout-ignore><div class="grid"></div><div class="orb a"></div><div class="orb b"></div></div>
    <div class="brand" data-layout-allow-occlusion><i>时</i><span>净界AI内容工厂</span></div>
    <div id="scenes"></div>
    __AUDIO_ELEMENT__
  </div>
  <script>
    const plan = __MOTION_PLAN_JSON__;
    const scenesRoot = document.querySelector("#scenes");
    const esc = (value) => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const waveBars = () => Array.from({length: 16}, (_, index) => `<i style="height:${55 + (index % 5) * 34}px"></i>`).join("");
    const FAMILY_VARIANTS = {
      "radial-focus": ["stat-ring", "signal-grid", "target-burst"],
      "evidence-lens": ["magnifier", "focus-lens", "source-spotlight"],
      "space-scale": ["liquid-chamber", "room-map", "scope-box"],
      "sequential-flow": ["process-flow", "checklist-path", "decision-ladder"],
      "temporal-wave": ["clock-wave", "timeline-pulse", "cadence-track"],
      "document-stack": ["report-scan", "source-stack", "citation-pages"],
      "binary-compare": ["compare", "option-compare", "tradeoff-balance"],
      "orbit-conclusion": ["orbit-summary", "action-orbit", "boundary-orbit"],
      "threshold-gauge": ["risk-gauge", "compliance-meter", "confidence-dial"],
      "layered-pyramid": ["evidence-pyramid", "decision-stack", "priority-layers"],
      "network-map": ["source-network", "audience-network", "action-network"],
      "shield-boundary": ["safety-shield", "claim-guard", "scope-fence"]
    };
    const labeledItems = (values, className, prefix) => values.map((value, index) => `<div class="${className} ${prefix}${index + 1}">${esc(value)}</div>`).join("");
    const orbitChips = (values) => values.map((value, index) => `<div class="chip c${index + 1}">${esc(value)}</div>`).join("");
    const atmosphereMarkup = (index) => {
      const particles = Array.from({length: 12}, (_, particleIndex) => {
        const left = 70 + ((particleIndex * 83 + index * 41) % 920);
        const top = 420 + ((particleIndex * 137 + index * 89) % 1120);
        return `<i class="flow-particle p${particleIndex + 1}" style="left:${left}px;top:${top}px"></i>`;
      }).join("");
      return `<div class="scene-atmosphere" data-layout-ignore><div class="atmo-glow"></div><svg class="airflow" viewBox="0 0 1080 1920" aria-hidden="true"><path class="flow-line f1" d="M-80 1540 C260 1370 120 970 510 830 S840 420 1160 250"/><path class="flow-line f2" d="M-120 1260 C180 1130 360 1330 530 1010 S760 560 1160 600"/><path class="flow-line f3" d="M40 1830 C370 1520 730 1570 600 1160 S450 590 900 110"/></svg>${particles}<i class="pulse-ring r1"></i><i class="pulse-ring r2"></i><i class="pulse-ring r3"></i><i class="kinetic-rail"></i></div>`;
    };

    const FAMILY_BUILDERS = {
      "radial-focus": (scene, type) => {
        if (type === "stat-ring") return `<div class="radial-shell" data-variant="${type}"><div class="ring"><span>${esc(scene.title)}</span></div>${Array.from({length:8},(_, index)=>`<i class="radial-tick t${index+1}"></i>`).join("")}</div>`;
        if (type === "signal-grid") return `<div class="radial-shell" data-variant="${type}"><div class="signal-core">${esc(scene.title)}</div>${labeledItems(["需求","对象","依据","行动"],"radial-node","n")}</div>`;
        return `<div class="radial-shell" data-variant="${type}"><div class="target-ring outer"></div><div class="target-ring middle"></div><div class="target-ring inner"></div><i class="cross h"></i><i class="cross v"></i><div class="target-core">锁定关键问题</div></div>`;
      },
      "evidence-lens": (_scene, type) => {
        const heading = type === "magnifier" ? "资料依据" : type === "focus-lens" ? "边界字段" : "来源核验";
        const lensClass = type === "focus-lens" ? "lens square" : type === "source-spotlight" ? "lens spotlight" : "lens";
        const badges = type === "source-spotlight" ? `<div class="source-badges">${["来源一","来源二","来源三"].map(value=>`<div class="source-badge">${value}</div>`).join("")}</div>` : "";
        return `<div class="evidence" data-variant="${type}"><b>${heading}</b><div class="line"></div><div class="line short"></div><div class="line risk"></div><div class="line"></div>${badges}</div><div class="${lensClass}"></div>`;
      },
      "space-scale": (_scene, type) => {
        if (type === "liquid-chamber") return `<div class="dose-layout" data-variant="${type}"><div class="bottle"><div class="liquid"></div></div><div class="chamber"></div></div>`;
        if (type === "room-map") return `<div class="room-plan" data-variant="${type}">${["入口","主要区域","相邻空间","通风路径"].map(value=>`<div class="room-cell">${value}</div>`).join("")}<div class="map-pin"><span>点</span></div></div>`;
        return `<div class="scope-stage" data-variant="${type}"><div class="scope-frame s1">全部场景</div><div class="scope-frame s2">适用条件</div><div class="scope-frame s3">当前结论</div></div>`;
      },
      "sequential-flow": (_scene, type) => {
        const labels = type === "process-flow" ? ["明确问题","核对依据","标注边界","执行行动"] : type === "checklist-path" ? ["资料齐全","来源可查","条件明确","结论可用"] : ["收集信息","比较方案","排除风险","形成决策"];
        return `<div class="flow-board" data-variant="${type}"><div class="flow-progress"></div>${labels.map((value,index)=>`<div class="flow-node f${index+1}"><b>${type === "checklist-path" ? "✓" : index+1}</b><span>${value}</span></div>`).join("")}</div>`;
      },
      "temporal-wave": (_scene, type) => {
        if (type === "clock-wave") return `<div class="time-layout" data-variant="${type}"><div class="clock"><div class="hand"></div></div><div class="wave">${waveBars()}</div></div>`;
        if (type === "timeline-pulse") return `<div class="timeline-board" data-variant="${type}"><div class="time-line"></div>${["开始","核验","判断","行动"].map(value=>`<div class="time-node">${value}</div>`).join("")}</div>`;
        return `<div class="cadence-board" data-variant="${type}">${["准备","核验","记录","复核"].map((value,row)=>`<div class="cadence-row"><span>${value}</span><div class="cadence-rail">${Array.from({length:5},(_,index)=>`<i class="cadence-bar" style="opacity:${.48+(row+index)%3*.2}"></i>`).join("")}</div></div>`).join("")}</div>`;
      },
      "document-stack": (_scene, type) => {
        if (type === "report-scan") return `<div class="report" data-variant="${type}"><h2>资料来源</h2><div class="row"><span>第一项</span><b>问题</b></div><div class="row"><span>第二项</span><b>依据</b></div><div class="row"><span>第三项</span><b>边界</b></div><div class="row"><span>第四项</span><b>行动</b></div><div class="scan" data-layout-allow-overflow data-layout-allow-occlusion></div></div>`;
        if (type === "source-stack") return `<div class="doc-stack" data-variant="${type}"><div class="doc-page p1"></div><div class="doc-page p2"></div><div class="doc-page p3"><h2>来源卡片</h2>${Array.from({length:5},()=>`<div class="doc-rule"></div>`).join("")}</div></div>`;
        return `<div class="citation-book" data-variant="${type}"><div class="citation-sheet"><h2>引用页签</h2>${Array.from({length:6},()=>`<div class="doc-rule"></div>`).join("")}</div>${labeledItems(["来源","日期","范围","限制"],"citation-tab","c")}</div>`;
      },
      "binary-compare": (_scene, type) => {
        if (type === "tradeoff-balance") return `<div class="balance" data-variant="${type}"><div class="balance-post"></div><div class="balance-beam"></div><div class="weight left">可获得的价值</div><div class="weight right">需要承担的限制</div></div>`;
        const labels = type === "compare" ? ["已有依据","实际场景"] : ["方案 A","方案 B"];
        return `<div class="compare" data-variant="${type}"><div class="panel">${labels[0]}</div><div class="neq">${type === "compare" ? "≠" : "↔"}</div><div class="panel alt">${labels[1]}</div></div>`;
      },
      "orbit-conclusion": (scene, type) => {
        const values = type === "orbit-summary" ? ["依据","对象","范围","时间","场景","限制"] : type === "action-orbit" ? ["准备","核验","记录","判断","咨询","复核"] : ["可确认","需核验","不外推","有条件","留记录","再咨询"];
        const core = type === "action-orbit" ? "下一步行动" : type === "boundary-orbit" ? "结论边界" : scene.title;
        return `<div class="orbit" data-variant="${type}"><div class="core"><span>${esc(core)}</span></div>${orbitChips(values)}</div>`;
      },
      "threshold-gauge": (_scene, type) => {
        if (type === "compliance-meter") return `<div class="meter-stage" data-variant="${type}"><div class="meter"><div class="meter-fill"></div></div><div class="meter-checks">${["输入已核对","来源可追溯","边界已标注","行动可复核"].map(value=>`<div class="meter-check">✓ ${value}</div>`).join("")}</div></div>`;
        const core = type === "risk-gauge" ? "风险阈值" : "可信程度";
        return `<div class="threshold-stage" data-variant="${type}"><div class="gauge"><div class="gauge-core">${core}</div><div class="gauge-needle"></div>${Array.from({length:6},(_,index)=>`<i class="gauge-tick g${index+1}"></i>`).join("")}</div></div>`;
      },
      "layered-pyramid": (_scene, type) => {
        if (type === "evidence-pyramid") return `<div class="pyramid" data-variant="${type}"><div class="layer-item l1">原始资料</div><div class="layer-item l2">可核验依据</div><div class="layer-item l3">适用边界</div><div class="layer-item l4">行动结论</div></div>`;
        if (type === "decision-stack") return `<div class="layered-cards" data-variant="${type}"><div class="layered-card l1">01 收集条件</div><div class="layered-card l2">02 比较选项</div><div class="layered-card l3">03 作出决策</div></div>`;
        return `<div class="priority-board" data-variant="${type}"><div class="priority-row"><span>优先处理</span><b>立即</b></div><div class="priority-row p2"><span>持续核验</span><b>随后</b></div><div class="priority-row p3"><span>保留观察</span><b>记录</b></div></div>`;
      },
      "network-map": (_scene, type) => {
        const values = type === "source-network" ? ["报告","标准","记录","材料"] : type === "audience-network" ? ["家庭","员工","客户","伙伴"] : ["准备","核验","执行","复核"];
        const core = type === "source-network" ? "证据中心" : type === "audience-network" ? "目标受众" : "行动路径";
        return `<div class="network-stage" data-variant="${type}"><div class="network-core">${core}</div>${labeledItems(values,"network-node","n")}${Array.from({length:4},(_,index)=>`<i class="connector c${index+1}"></i>`).join("")}</div>`;
      },
      "shield-boundary": (_scene, type) => {
        if (type === "safety-shield") return `<div class="shield-stage" data-variant="${type}"><div class="shield">安全边界</div><div class="guard-list">${["不虚构","不外推","可追溯"].map(value=>`<div class="guard-row">✓ ${value}</div>`).join("")}</div></div>`;
        if (type === "claim-guard") return `<div class="claim-gate" data-variant="${type}"><div class="gate-post"></div><div class="gate-arm"></div><div class="claim-card c1">事实主张</div><div class="claim-card c2">证据来源</div><div class="claim-card c3">适用条件</div></div>`;
        return `<div class="fence-stage" data-variant="${type}"><i class="fence-piece top"></i><i class="fence-piece right"></i><i class="fence-piece bottom"></i><i class="fence-piece left"></i><div class="fence-core">只在已确认范围内使用</div></div>`;
      }
    };

    function visualMarkup(scene) {
      const family = scene.renderer_family;
      const variants = FAMILY_VARIANTS[family];
      if (!variants || !variants.includes(scene.visual_type) || !FAMILY_BUILDERS[family]) throw new Error(`未实现的可信动画积木：${scene.visual_type}`);
      return FAMILY_BUILDERS[family](scene, scene.visual_type);
    }

    function finiteAnimation(element, keyframes, timing) {
      if (!element) return null;
      const animation = element.animate(keyframes, Object.assign({fill: "both", iterations: 1}, timing));
      animation.pause();
      return animation;
    }

    function animateAll(root, selector, keyframes, timing, staggerMs) {
      root.querySelectorAll(selector).forEach((element, index) => {
        finiteAnimation(element, keyframes, Object.assign({}, timing, {delay: timing.delay + index * staggerMs}));
      });
    }

    function animateAtmosphere(root, index, startMs, durationMs) {
      const direction = index % 2 === 0 ? 1 : -1;
      finiteAnimation(root.querySelector(".scene-atmosphere"), [{opacity:0},{opacity:1,offset:.08},{opacity:1,offset:.9},{opacity:0}], {duration:durationMs,delay:startMs,easing:"linear"});
      root.querySelectorAll(".flow-line").forEach((line, lineIndex) => {
        finiteAnimation(line, [
          {strokeDashoffset:"1500",opacity:.08,transform:`translateX(${-26 * direction}px)`},
          {strokeDashoffset:"420",opacity:.88,transform:`translateX(${18 * direction}px)`,offset:.38},
          {strokeDashoffset:"-620",opacity:.64,transform:`translateX(${-10 * direction}px)`,offset:.72},
          {strokeDashoffset:"-1580",opacity:.16,transform:`translateX(${24 * direction}px)`}
        ], {duration:Math.max(1400,durationMs),delay:startMs+lineIndex*120,easing:"linear"});
      });
      root.querySelectorAll(".flow-particle").forEach((particle, particleIndex) => {
        const lateral = ((particleIndex % 5) - 2) * 38 * direction;
        finiteAnimation(particle, [
          {transform:"translate3d(0,220px,0) scale(.35)",opacity:0},
          {transform:`translate3d(${lateral*.25}px,30px,0) scale(1)`,opacity:.92,offset:.2},
          {transform:`translate3d(${lateral}px,-430px,0) scale(.72)`,opacity:.7,offset:.68},
          {transform:`translate3d(${-lateral*.55}px,-850px,0) scale(.18)`,opacity:0}
        ], {duration:Math.max(1200,durationMs-240),delay:startMs+(particleIndex%4)*115,easing:"cubic-bezier(.34,0,.2,1)"});
      });
      root.querySelectorAll(".pulse-ring").forEach((ring, ringIndex) => {
        const offset = ringIndex * .13;
        finiteAnimation(ring, [
          {transform:"scale(.25)",opacity:0},
          {transform:"scale(.62)",opacity:.72,offset:.12+offset},
          {transform:"scale(1.45)",opacity:0,offset:.36+offset},
          {transform:"scale(.38)",opacity:0,offset:.48+offset},
          {transform:"scale(.78)",opacity:.55,offset:.66+offset/2},
          {transform:"scale(1.72)",opacity:0}
        ], {duration:Math.max(1600,durationMs),delay:startMs,easing:"cubic-bezier(.2,0,.28,1)"});
      });
      finiteAnimation(root.querySelector(".kinetic-rail"), [{transform:"scaleY(0)",opacity:0},{transform:"scaleY(.48)",opacity:.92,offset:.24},{transform:"scaleY(1)",opacity:.76,offset:.78},{transform:"scaleY(.18)",opacity:0}], {duration:durationMs,delay:startMs,easing:"cubic-bezier(.2,0,.2,1)"});
      finiteAnimation(root.querySelector(".atmo-glow"), [
        {transform:`translate3d(${-90*direction}px,80px,0) scale(.72)`,opacity:.2},
        {transform:`translate3d(${70*direction}px,-70px,0) scale(1.18)`,opacity:.72,offset:.48},
        {transform:`translate3d(${-35*direction}px,15px,0) scale(.9)`,opacity:.34}
      ], {duration:durationMs,delay:startMs,easing:"ease-in-out"});
    }

    const FAMILY_ANIMATORS = {
      "radial-focus": (root, scene, startMs, durationMs) => {
        animateAll(root, ".ring,.signal-core,.target-ring", [{transform:"scale(.28) rotate(-20deg)",opacity:0},{transform:"scale(1)",opacity:1,offset:.42},{transform:"scale(1.06)",opacity:1,offset:.72},{transform:"scale(1)",opacity:1}], {duration:Math.min(2800,durationMs-300),delay:startMs+280,easing:"cubic-bezier(.2,0,0,1)"}, 90);
        animateAll(root, ".radial-node", [{transform:"translateY(46px) scale(.7)",opacity:0},{transform:"translateY(0) scale(1)",opacity:1}], {duration:520,delay:startMs+620,easing:"ease-out"}, 120);
        animateAll(root, ".radial-tick,.cross", [{opacity:0},{opacity:1}], {duration:430,delay:startMs+520,easing:"linear"}, 65);
      },
      "evidence-lens": (root, _scene, startMs, durationMs) => {
        finiteAnimation(root.querySelector(".evidence"), [{transform:"translateY(140px) rotate(4deg)",opacity:0},{transform:"translateY(0) rotate(-1.5deg)",opacity:1}], {duration:750,delay:startMs+300,easing:"cubic-bezier(.2,0,0,1)"});
        animateAll(root, ".line,.doc-rule", [{transform:"scaleX(0)",opacity:0},{transform:"scaleX(1)",opacity:1}], {duration:380,delay:startMs+650,easing:"ease-out"}, 110);
        finiteAnimation(root.querySelector(".lens"), [{transform:"translate(0,0) scale(.2)",opacity:0},{transform:"translate(0,0) scale(1)",opacity:1,offset:.25},{transform:"translate(-320px,-190px) scale(1)",opacity:1,offset:.68},{transform:"translate(0,0) scale(1)",opacity:1}], {duration:Math.min(3400,durationMs-300),delay:startMs+850,easing:"ease-in-out"});
        animateAll(root, ".source-badge", [{transform:"translateY(30px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:420,delay:startMs+900,easing:"ease-out"}, 120);
      },
      "space-scale": (root, _scene, startMs, _durationMs) => {
        finiteAnimation(root.querySelector(".bottle"), [{transform:"translateY(120px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:700,delay:startMs+350,easing:"ease-out"});
        finiteAnimation(root.querySelector(".liquid"), [{transform:"scaleY(0)"},{transform:"scaleY(1)"}], {duration:1350,delay:startMs+800,easing:"ease-in-out"});
        finiteAnimation(root.querySelector(".chamber"), [{transform:"scaleX(.2)",opacity:0},{transform:"scaleX(1)",opacity:1}], {duration:800,delay:startMs+550,easing:"ease-out"});
        animateAll(root, ".room-cell,.scope-frame", [{transform:"scale(.65)",opacity:0},{transform:"scale(1)",opacity:1}], {duration:560,delay:startMs+420,easing:"cubic-bezier(.2,0,0,1)"}, 130);
        finiteAnimation(root.querySelector(".map-pin"), [{transform:"rotate(-45deg) scale(.2)",opacity:0},{transform:"rotate(-45deg) scale(1.18)",opacity:1,offset:.65},{transform:"rotate(-45deg) scale(1)",opacity:1}], {duration:900,delay:startMs+1050,easing:"ease-out"});
      },
      "sequential-flow": (root, _scene, startMs, durationMs) => {
        finiteAnimation(root.querySelector(".flow-progress"), [{transform:"scaleY(0)",opacity:0},{transform:"scaleY(1)",opacity:1}], {duration:Math.min(2300,durationMs-700),delay:startMs+480,easing:"ease-in-out"});
        animateAll(root, ".flow-node", [{transform:"translateX(-70px) scale(.9)",opacity:0},{transform:"translateX(0) scale(1)",opacity:1}], {duration:520,delay:startMs+500,easing:"cubic-bezier(.2,0,0,1)"}, 230);
      },
      "temporal-wave": (root, _scene, startMs, durationMs) => {
        finiteAnimation(root.querySelector(".clock"), [{transform:"scale(.3) rotate(-50deg)",opacity:0},{transform:"scale(1)",opacity:1}], {duration:780,delay:startMs+350,easing:"cubic-bezier(.2,0,0,1)"});
        finiteAnimation(root.querySelector(".hand"), [{transform:"rotate(0deg)"},{transform:"rotate(310deg)"}], {duration:Math.max(2000,durationMs-1000),delay:startMs+700,easing:"ease-in-out"});
        animateAll(root, ".wave i", [{transform:"scaleY(.1)",opacity:0},{transform:"scaleY(1.8)",opacity:1,offset:.55},{transform:"scaleY(1)",opacity:1}], {duration:1200,delay:startMs+600,easing:"ease-in-out"}, 50);
        finiteAnimation(root.querySelector(".time-line"), [{transform:"scaleX(0)"},{transform:"scaleX(1)"}], {duration:Math.min(2200,durationMs-600),delay:startMs+450,easing:"ease-in-out"});
        animateAll(root, ".time-node,.cadence-row", [{transform:"translateY(45px) scale(.7)",opacity:0},{transform:"translateY(0) scale(1)",opacity:1}], {duration:520,delay:startMs+620,easing:"ease-out"}, 160);
        animateAll(root, ".cadence-bar", [{transform:"scaleX(.08)"},{transform:"scaleX(1)"}], {duration:600,delay:startMs+900,easing:"ease-in-out"}, 35);
      },
      "document-stack": (root, _scene, startMs, durationMs) => {
        finiteAnimation(root.querySelector(".report"), [{transform:"translateY(150px)"},{transform:"translateY(0)"}], {duration:780,delay:startMs+350,easing:"ease-out"});
        animateAll(root, ".row,.citation-tab", [{transform:"translateX(-38px)",opacity:0},{transform:"translateX(0)",opacity:1}], {duration:380,delay:startMs+720,easing:"ease-out"}, 110);
        finiteAnimation(root.querySelector(".scan"), [{transform:"translateY(0)"},{transform:"translateY(760px)"}], {duration:Math.min(2200,durationMs-500),delay:startMs+1200,easing:"ease-in-out"});
        animateAll(root, ".doc-page", [{transform:"translate(-70px,85px) scale(.82)",opacity:0},{transform:"translate(0,0) scale(1)",opacity:1}], {duration:680,delay:startMs+380,easing:"cubic-bezier(.2,0,0,1)"}, 160);
        finiteAnimation(root.querySelector(".citation-sheet"), [{transform:"translateY(120px) rotate(-3deg)",opacity:0},{transform:"translateY(0) rotate(0deg)",opacity:1}], {duration:760,delay:startMs+360,easing:"ease-out"});
      },
      "binary-compare": (root, _scene, startMs, _durationMs) => {
        finiteAnimation(root.querySelector(".panel:first-child"), [{transform:"translateX(-170px)",opacity:0},{transform:"translateX(0)",opacity:1}], {duration:750,delay:startMs+350,easing:"ease-out"});
        finiteAnimation(root.querySelector(".panel.alt"), [{transform:"translateX(170px)",opacity:0},{transform:"translateX(0)",opacity:1}], {duration:750,delay:startMs+480,easing:"ease-out"});
        finiteAnimation(root.querySelector(".neq"), [{transform:"scale(4) rotate(-20deg)",opacity:0},{transform:"scale(1)",opacity:1,offset:.55},{transform:"scale(1.22)",opacity:1},{transform:"scale(1)",opacity:1}], {duration:1600,delay:startMs+1000,easing:"ease-in-out"});
        finiteAnimation(root.querySelector(".balance-beam"), [{transform:"rotate(-14deg)",opacity:0},{transform:"rotate(8deg)",opacity:1,offset:.6},{transform:"rotate(0deg)",opacity:1}], {duration:1900,delay:startMs+480,easing:"ease-in-out"});
        animateAll(root, ".weight", [{transform:"translateY(-130px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:680,delay:startMs+700,easing:"ease-out"}, 280);
      },
      "orbit-conclusion": (root, scene, startMs, _durationMs) => {
        const endRotation = scene.visual_type === "boundary-orbit" ? "rotate(45deg)" : "rotate(0deg)";
        finiteAnimation(root.querySelector(".core"), [{transform:"scale(.2) rotate(-24deg)",opacity:0},{transform:`scale(1) ${endRotation}`,opacity:1,offset:.55},{transform:`scale(1.05) ${endRotation}`,opacity:1},{transform:`scale(1) ${endRotation}`,opacity:1}], {duration:2400,delay:startMs+350,easing:"ease-in-out"});
        animateAll(root, ".chip", [{transform:"scale(.25)",opacity:0},{transform:"scale(1)",opacity:1}], {duration:450,delay:startMs+650,easing:"ease-out"}, 120);
      },
      "threshold-gauge": (root, scene, startMs, durationMs) => {
        finiteAnimation(root.querySelector(".gauge"), [{transform:"scale(.45) rotate(-35deg)",opacity:0},{transform:"scale(1) rotate(0deg)",opacity:1}], {duration:820,delay:startMs+350,easing:"cubic-bezier(.2,0,0,1)"});
        const needleEnd = scene.visual_type === "risk-gauge" ? "rotate(132deg)" : "rotate(218deg)";
        finiteAnimation(root.querySelector(".gauge-needle"), [{transform:"rotate(-112deg)"},{transform:needleEnd}], {duration:Math.min(2500,durationMs-700),delay:startMs+720,easing:"ease-in-out"});
        animateAll(root, ".gauge-tick,.meter-check", [{opacity:0},{opacity:1}], {duration:360,delay:startMs+650,easing:"linear"}, 110);
        finiteAnimation(root.querySelector(".meter-fill"), [{transform:"scaleY(0)"},{transform:"scaleY(1)"}], {duration:Math.min(2400,durationMs-600),delay:startMs+500,easing:"ease-in-out"});
      },
      "layered-pyramid": (root, _scene, startMs, _durationMs) => {
        animateAll(root, ".layer-item", [{transform:"translateY(90px) scale(.7)",opacity:0},{transform:"translateY(0) scale(1)",opacity:1}], {duration:560,delay:startMs+420,easing:"cubic-bezier(.2,0,0,1)"}, 180);
        animateAll(root, ".layered-card", [{transform:"translate(120px,-70px) scale(.8)",opacity:0},{transform:"translate(0,0) scale(1)",opacity:1}], {duration:650,delay:startMs+420,easing:"ease-out"}, 220);
        animateAll(root, ".priority-row", [{transform:"scaleX(.15)",opacity:0},{transform:"scaleX(1)",opacity:1}], {duration:620,delay:startMs+420,easing:"ease-in-out"}, 210);
      },
      "network-map": (root, _scene, startMs, _durationMs) => {
        const angles = [0,-28,28,-28];
        root.querySelectorAll(".connector").forEach((element,index)=>finiteAnimation(element,[{transform:`rotate(${angles[index]}deg) scaleX(0)`,opacity:0},{transform:`rotate(${angles[index]}deg) scaleX(1)`,opacity:1}],{duration:650,delay:startMs+480+index*120,easing:"ease-in-out"}));
        finiteAnimation(root.querySelector(".network-core"), [{transform:"scale(.25) rotate(-25deg)",opacity:0},{transform:"scale(1)",opacity:1}], {duration:760,delay:startMs+350,easing:"cubic-bezier(.2,0,0,1)"});
        animateAll(root, ".network-node", [{transform:"scale(.35)",opacity:0},{transform:"scale(1)",opacity:1}], {duration:520,delay:startMs+650,easing:"ease-out"}, 150);
      },
      "shield-boundary": (root, _scene, startMs, durationMs) => {
        finiteAnimation(root.querySelector(".shield"), [{transform:"translateY(120px) scale(.55)",opacity:0},{transform:"translateY(0) scale(1)",opacity:1}], {duration:850,delay:startMs+350,easing:"cubic-bezier(.2,0,0,1)"});
        animateAll(root, ".guard-row,.claim-card", [{transform:"translateX(-95px)",opacity:0},{transform:"translateX(0)",opacity:1}], {duration:520,delay:startMs+650,easing:"ease-out"}, 180);
        finiteAnimation(root.querySelector(".gate-arm"), [{transform:"rotate(-72deg)"},{transform:"rotate(0deg)"}], {duration:Math.min(1800,durationMs-800),delay:startMs+850,easing:"ease-in-out"});
        animateAll(root, ".fence-piece.top,.fence-piece.bottom", [{transform:"scaleX(0)"},{transform:"scaleX(1)"}], {duration:740,delay:startMs+450,easing:"ease-in-out"}, 180);
        animateAll(root, ".fence-piece.left,.fence-piece.right", [{transform:"scaleY(0)"},{transform:"scaleY(1)"}], {duration:740,delay:startMs+620,easing:"ease-in-out"}, 180);
        finiteAnimation(root.querySelector(".fence-core"), [{transform:"scale(.6)",opacity:0},{transform:"scale(1)",opacity:1}], {duration:680,delay:startMs+950,easing:"ease-out"});
      }
    };

    function animateScene(scene, index) {
      const root = document.getElementById(scene.id);
      const startMs = Number(scene.start) * 1000;
      const durationMs = (Number(scene.end) - Number(scene.start)) * 1000;
      finiteAnimation(root.querySelector(".top"), [{transform:"translateY(-36px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:420,delay:startMs,easing:"cubic-bezier(.2,0,0,1)"});
      finiteAnimation(root.querySelector(".kicker"), [{transform:"translateX(-65px)",opacity:0},{transform:"translateX(0)",opacity:1}], {duration:480,delay:startMs+50,easing:"cubic-bezier(.2,0,0,1)"});
      finiteAnimation(root.querySelector("h1"), [{transform:"translateY(70px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:620,delay:startMs+100,easing:"cubic-bezier(.2,0,0,1)"});
      finiteAnimation(root.querySelector(".caption span"), [{transform:"translateY(35px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:450,delay:startMs+160,easing:"cubic-bezier(.2,0,0,1)"});
      const cameraDirection = index % 2 === 0 ? 1 : -1;
      finiteAnimation(root.querySelector(".content"), [
        {transform:`translate3d(${-16*cameraDirection}px,24px,0) scale(1.015)`},
        {transform:`translate3d(${10*cameraDirection}px,-8px,0) scale(1.048)`,offset:.52},
        {transform:`translate3d(${-5*cameraDirection}px,-28px,0) scale(1.075)`}
      ], {duration:Math.max(800,durationMs),delay:startMs,easing:"cubic-bezier(.3,0,.2,1)"});
      finiteAnimation(root.querySelector(".visual"), [
        {transform:`translate3d(${-22*cameraDirection}px,30px,0) rotate(${-0.7*cameraDirection}deg) scale(.97)`},
        {transform:`translate3d(${18*cameraDirection}px,-12px,0) rotate(${0.45*cameraDirection}deg) scale(1.035)`,offset:.46},
        {transform:`translate3d(${-8*cameraDirection}px,-34px,0) rotate(${-0.25*cameraDirection}deg) scale(1.015)`}
      ], {duration:Math.max(800,durationMs),delay:startMs,easing:"ease-in-out"});
      animateAtmosphere(root, index, startMs, durationMs);

      const family = scene.renderer_family;
      const animator = FAMILY_ANIMATORS[family];
      if (!animator) throw new Error(`未实现的renderer family运动：${family}`);
      animator(root, scene, startMs, durationMs);
      if (index < plan.scenes.length - 1) {
        const wipe = root.querySelector(".scene-wipe");
        wipe.style.backgroundColor = scene.transition === "orange-wipe" ? "#512A20" : scene.transition === "green-wipe" ? "#164B3D" : "#34420E";
        finiteAnimation(root.querySelector(".content"), [{opacity:1},{opacity:0}], {duration:140,delay:Number(scene.end)*1000-700,easing:"linear"});
        finiteAnimation(root.querySelector(".caption"), [{opacity:1},{opacity:0}], {duration:140,delay:Number(scene.end)*1000-700,easing:"linear"});
        finiteAnimation(wipe, [{transform:"translateX(-115%)"},{transform:"translateX(0)",offset:.45},{transform:"translateX(115%)"}], {duration:620,delay:Number(scene.end)*1000-620,easing:"cubic-bezier(.7,0,.3,1)"});
      }
    }

    plan.scenes.forEach((scene, index) => {
      const node = document.createElement("section");
      node.className = `scene clip ${scene.visual_type}`;
      node.id = scene.id;
      node.setAttribute("data-start", String(scene.start));
      node.setAttribute("data-duration", String(Number(scene.end) - Number(scene.start)));
      node.setAttribute("data-track-index", String(index + 1));
      node.setAttribute("data-layout-allow-overlap", "");
      node.setAttribute("data-layout-allow-occlusion", "");
      node.innerHTML = `${atmosphereMarkup(index)}<div class="content" data-layout-allow-overflow><div class="top"><span>${String(index+1).padStart(2,"0")} / ${String(plan.scenes.length).padStart(2,"0")}</span></div><div class="kicker">${esc(scene.kicker)}</div><h1>${esc(scene.title)}</h1><div class="visual">${visualMarkup(scene)}</div></div><div class="caption"><span>${esc(scene.caption)}</span></div><div class="scene-wipe" data-layout-allow-overflow data-layout-allow-occlusion></div>`;
      scenesRoot.appendChild(node);
    });
    plan.scenes.forEach(animateScene);
    const totalDurationMs = Math.max(1000, Number(plan.duration_seconds || __DURATION__) * 1000);
    finiteAnimation(document.querySelector(".orb.a"), [{transform:"translate3d(-90px,-40px,0) scale(.8)"},{transform:"translate3d(170px,210px,0) scale(1.28)",offset:.5},{transform:"translate3d(-20px,90px,0) scale(.94)"}], {duration:totalDurationMs,delay:0,easing:"ease-in-out"});
    finiteAnimation(document.querySelector(".orb.b"), [{transform:"translate3d(110px,100px,0) scale(.75)"},{transform:"translate3d(-190px,-230px,0) scale(1.35)",offset:.56},{transform:"translate3d(20px,-80px,0) scale(1)"}], {duration:totalDurationMs,delay:0,easing:"ease-in-out"});
  </script>
</body>
</html>
