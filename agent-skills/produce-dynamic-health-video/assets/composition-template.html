<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <style>
    @font-face { font-family: "Noto Sans SC"; src: url("assets/NotoSansSC-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Noto Sans SC"; src: url("assets/NotoSansSC-Bold.ttf") format("truetype"); font-weight: 700 900; font-style: normal; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #071713; }
    body { color: #F1EFE7; font-family: "Noto Sans SC", sans-serif; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    .ambient { position: absolute; inset: 0; overflow: hidden; background: #071713; }
    .grid { position: absolute; inset: -180px; opacity: .2; background-image: linear-gradient(rgba(200,227,91,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(200,227,91,.06) 1px, transparent 1px); background-size: 72px 72px; transform: perspective(900px) rotateX(58deg) translateY(700px) scale(1.9); }
    .orb { position: absolute; border-radius: 50%; filter: blur(2px); }
    .orb.a { width: 650px; height: 650px; left: -270px; top: 30px; background: radial-gradient(circle, rgba(31,90,70,.9), transparent 68%); }
    .orb.b { width: 560px; height: 560px; right: -230px; bottom: 80px; background: radial-gradient(circle, rgba(200,227,91,.17), transparent 68%); }
    .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
    .content { position: absolute; inset: 0; padding: 118px 78px 270px; display: flex; flex-direction: column; }
    .top { display: flex; justify-content: space-between; align-items: center; font-size: 24px; letter-spacing: .12em; color: #C8E35B; }
    .brand { position: absolute; left: 64px; top: 48px; z-index: 30; display: flex; gap: 14px; align-items: center; color: #B8CFC5; font-size: 22px; }
    .brand i { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: #C8E35B; color: #071713; font-style: normal; font-weight: 900; }
    .kicker { margin-top: 105px; color: #C8E35B; font-size: 31px; font-weight: 800; }
    h1 { margin: 28px 0 0; max-width: 920px; font-size: 82px; line-height: 1.12; letter-spacing: -.045em; }
    .visual { position: relative; flex: 1; min-height: 740px; margin-top: 48px; display: grid; place-items: center; }
    .caption { position: absolute; left: 70px; right: 70px; bottom: 88px; z-index: 24; min-height: 102px; padding: 22px 34px; display: grid; place-items: center; border: 1px solid rgba(200,227,91,.42); border-radius: 26px; background: rgba(3,15,12,.93); text-align: center; font-size: 36px; line-height: 1.42; font-weight: 800; }
    .scene-wipe { position: absolute; inset: -60px; z-index: 50; background: #C8E35B; transform: translateX(-115%); }
    .ring { width: 470px; height: 470px; border: 14px solid #C8E35B; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 90px rgba(200,227,91,.18); }
    .ring span { width: 365px; text-align: center; font-size: 58px; line-height: 1.08; font-weight: 900; }
    .evidence { width: 790px; height: 560px; padding: 76px 70px; border-radius: 28px; background: #F1EFE7; transform: rotate(-1.5deg); }
    .evidence b { color: #164B3D; font-size: 64px; }
    .line { display: block; width: 100%; height: 16px; margin-top: 32px; border-radius: 8px; background: #B7B9AE; transform-origin: left; }
    .line.short { width: 62%; } .line.risk { width: 86%; background: #DF744F; }
    .lens { position: absolute; width: 230px; height: 230px; right: 80px; bottom: 110px; border: 12px solid #C8E35B; border-radius: 50%; background: rgba(200,227,91,.12); box-shadow: 0 0 0 18px rgba(7,23,19,.18); }
    .lens::after { content: ""; position: absolute; width: 125px; height: 18px; right: -93px; bottom: -48px; border-radius: 9px; background: #C8E35B; transform: rotate(48deg); }
    .dose-layout { width: 820px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px; align-items: end; }
    .bottle { width: 220px; height: 430px; position: relative; overflow: hidden; border: 10px solid #F1EFE7; border-radius: 80px 80px 60px 60px; }
    .liquid { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 70%; border-radius: 0 0 44px 44px; background: #C8E35B; transform: scaleY(0); transform-origin: bottom; }
    .chamber { height: 480px; border: 4px solid #C8E35B; position: relative; box-shadow: inset 0 0 0 34px rgba(31,90,70,.22); }
    .chamber::after { content: "使用场景"; position: absolute; left: 34px; bottom: 32px; color: #C8E35B; font-size: 30px; font-weight: 800; }
    .time-layout { width: 820px; display: grid; grid-template-columns: 300px 1fr; gap: 70px; align-items: center; }
    .clock { width: 300px; height: 300px; border: 10px solid #C8E35B; border-radius: 50%; position: relative; }
    .hand { position: absolute; width: 12px; height: 112px; left: 139px; top: 42px; border-radius: 6px; background: #DF744F; transform-origin: 50% 108px; }
    .wave { height: 260px; display: flex; gap: 13px; align-items: center; }
    .wave i { display: block; width: 20px; height: 90px; border-radius: 10px; background: #C8E35B; transform-origin: center; }
    .report { width: 780px; min-height: 700px; padding: 64px; position: relative; overflow: hidden; background: #F1EFE7; color: #09261F; box-shadow: 0 30px 90px rgba(0,0,0,.35); }
    .report h2 { margin: 0 0 40px; font-size: 58px; }
    .row { display: flex; justify-content: space-between; padding: 30px 0; border-top: 2px solid #B8B9AF; font-size: 29px; }
    .scan { position: absolute; left: 0; right: 0; top: -20px; height: 16px; background: #C8E35B; box-shadow: 0 0 35px #C8E35B; }
    .compare { width: 850px; display: grid; grid-template-columns: 1fr 90px 1fr; gap: 25px; align-items: center; }
    .panel { height: 540px; padding: 40px 30px; border: 3px solid #1F5A46; display: grid; place-items: center; text-align: center; font-size: 38px; font-weight: 900; }
    .panel.alt { border-color: #DF744F; }
    .neq { color: #DF744F; font-size: 92px; font-weight: 900; text-align: center; }
    .orbit { width: 790px; height: 690px; position: relative; }
    .core { position: absolute; width: 310px; height: 310px; left: 240px; top: 190px; display: grid; place-items: center; padding: 35px; border: 8px solid #C8E35B; border-radius: 50%; background: #071713; color: #C8E35B; text-align: center; font-size: 46px; line-height: 1.15; font-weight: 900; }
    .chip { position: absolute; min-width: 210px; padding: 24px 26px; border: 2px solid #C8E35B; background: #194D3E; text-align: center; font-size: 28px; font-weight: 800; }
    .chip.c1 { left: 0; top: 40px; } .chip.c2 { right: 0; top: 40px; } .chip.c3 { left: -15px; top: 305px; } .chip.c4 { right: -15px; top: 305px; } .chip.c5 { left: 95px; bottom: 5px; } .chip.c6 { right: 95px; bottom: 5px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="clean-air-motion-output" data-no-timeline data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920" data-fps="30">
    <div class="ambient" data-layout-ignore><div class="grid"></div><div class="orb a"></div><div class="orb b"></div></div>
    <div class="brand" data-layout-allow-occlusion><i>时</i><span>净界AI内容工厂</span></div>
    <div id="scenes"></div>
    __AUDIO_ELEMENT__
  </div>
  <script>
    const plan = __MOTION_PLAN_JSON__;
    const scenesRoot = document.querySelector("#scenes");
    const esc = (value) => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const waveBars = () => Array.from({length: 16}, (_, index) => `<i style="height:${55 + (index % 5) * 34}px"></i>`).join("");
    const orbitChips = () => ["依据", "对象", "范围", "时间", "场景", "限制"].map((value, index) => `<div class="chip c${index + 1}">${value}</div>`).join("");

    function visualMarkup(scene) {
      const family = scene.renderer_family;
      if (family === "radial-focus") return `<div class="ring"><span>${esc(scene.title)}</span></div>`;
      if (family === "evidence-lens") return `<div class="evidence"><b>资料依据</b><div class="line"></div><div class="line short"></div><div class="line risk"></div><div class="line"></div></div><div class="lens"></div>`;
      if (family === "space-scale") return `<div class="dose-layout"><div class="bottle"><div class="liquid"></div></div><div class="chamber"></div></div>`;
      if (family === "temporal-wave") return `<div class="time-layout"><div class="clock"><div class="hand"></div></div><div class="wave">${waveBars()}</div></div>`;
      if (family === "document-stack" || family === "sequential-flow") return `<div class="report"><h2>${family === "sequential-flow" ? "执行路径" : "资料来源"}</h2><div class="row"><span>第一项</span><b>问题</b></div><div class="row"><span>第二项</span><b>依据</b></div><div class="row"><span>第三项</span><b>边界</b></div><div class="row"><span>第四项</span><b>行动</b></div><div class="scan" data-layout-allow-overflow data-layout-allow-occlusion></div></div>`;
      if (family === "binary-compare") return `<div class="compare"><div class="panel">已有依据</div><div class="neq">≠</div><div class="panel alt">实际场景</div></div>`;
      return `<div class="orbit"><div class="core">${esc(scene.title)}</div>${orbitChips()}</div>`;
    }

    function finiteAnimation(element, keyframes, timing) {
      const animation = element.animate(keyframes, Object.assign({fill: "both", iterations: 1}, timing));
      animation.pause();
      return animation;
    }

    function animateAll(selector, keyframes, timing, staggerMs) {
      document.querySelectorAll(selector).forEach((element, index) => {
        finiteAnimation(element, keyframes, Object.assign({}, timing, {delay: timing.delay + index * staggerMs}));
      });
    }

    function animateScene(scene, index) {
      const root = document.getElementById(scene.id);
      const startMs = Number(scene.start) * 1000;
      const durationMs = (Number(scene.end) - Number(scene.start)) * 1000;
      finiteAnimation(root.querySelector(".top"), [{transform:"translateY(-36px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:420,delay:startMs,easing:"cubic-bezier(.2,0,0,1)"});
      finiteAnimation(root.querySelector(".kicker"), [{transform:"translateX(-65px)",opacity:0},{transform:"translateX(0)",opacity:1}], {duration:480,delay:startMs+50,easing:"cubic-bezier(.2,0,0,1)"});
      finiteAnimation(root.querySelector("h1"), [{transform:"translateY(70px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:620,delay:startMs+100,easing:"cubic-bezier(.2,0,0,1)"});
      finiteAnimation(root.querySelector(".caption"), [{transform:"translateY(35px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:450,delay:startMs+160,easing:"cubic-bezier(.2,0,0,1)"});
      finiteAnimation(root.querySelector(".visual"), [{transform:"translateY(0)"},{transform:"translateY(-14px)"}], {duration:Math.max(500,durationMs),delay:startMs,easing:"linear"});

      const family = scene.renderer_family;
      if (family === "radial-focus") finiteAnimation(root.querySelector(".ring"), [{transform:"scale(.35) rotate(-18deg)",opacity:0},{transform:"scale(1)",opacity:1,offset:.35},{transform:"scale(1.06)",opacity:1,offset:.68},{transform:"scale(1)",opacity:1}], {duration:Math.min(3000,durationMs-200),delay:startMs+280,easing:"cubic-bezier(.2,0,0,1)"});
      if (family === "evidence-lens") {
        finiteAnimation(root.querySelector(".evidence"), [{transform:"translateY(140px) rotate(4deg)",opacity:0},{transform:"translateY(0) rotate(-1.5deg)",opacity:1}], {duration:750,delay:startMs+300,easing:"cubic-bezier(.2,0,0,1)"});
        animateAll(`#${scene.id} .line`, [{transform:"scaleX(0)",opacity:0},{transform:"scaleX(1)",opacity:1}], {duration:380,delay:startMs+650,easing:"ease-out"}, 110);
        finiteAnimation(root.querySelector(".lens"), [{transform:"translate(0,0) scale(.2)",opacity:0},{transform:"translate(0,0) scale(1)",opacity:1,offset:.25},{transform:"translate(-420px,-210px) scale(1)",opacity:1,offset:.65},{transform:"translate(0,0) scale(1)",opacity:1}], {duration:Math.min(3400,durationMs-300),delay:startMs+850,easing:"ease-in-out"});
      }
      if (family === "space-scale") {
        finiteAnimation(root.querySelector(".bottle"), [{transform:"translateY(120px)",opacity:0},{transform:"translateY(0)",opacity:1}], {duration:700,delay:startMs+350,easing:"ease-out"});
        finiteAnimation(root.querySelector(".liquid"), [{transform:"scaleY(0)"},{transform:"scaleY(1)"}], {duration:1350,delay:startMs+800,easing:"ease-in-out"});
        finiteAnimation(root.querySelector(".chamber"), [{transform:"scaleX(.2)",opacity:0},{transform:"scaleX(1)",opacity:1}], {duration:800,delay:startMs+550,easing:"ease-out"});
      }
      if (family === "temporal-wave") {
        finiteAnimation(root.querySelector(".clock"), [{transform:"scale(.3) rotate(-50deg)",opacity:0},{transform:"scale(1)",opacity:1}], {duration:780,delay:startMs+350,easing:"cubic-bezier(.2,0,0,1)"});
        finiteAnimation(root.querySelector(".hand"), [{transform:"rotate(0deg)"},{transform:"rotate(310deg)"}], {duration:Math.max(2000,durationMs-1000),delay:startMs+700,easing:"ease-in-out"});
        animateAll(`#${scene.id} .wave i`, [{transform:"scaleY(.1)",opacity:0},{transform:"scaleY(1.8)",opacity:1,offset:.55},{transform:"scaleY(1)",opacity:1}], {duration:1200,delay:startMs+600,easing:"ease-in-out"}, 50);
      }
      if (family === "document-stack" || family === "sequential-flow") {
        finiteAnimation(root.querySelector(".report"), [{transform:"translateY(150px)"},{transform:"translateY(0)"}], {duration:780,delay:startMs+350,easing:"ease-out"});
        animateAll(`#${scene.id} .row`, [{transform:"translateX(-28px)",opacity:0},{transform:"translateX(0)",opacity:1}], {duration:350,delay:startMs+750,easing:"ease-out"}, 100);
        finiteAnimation(root.querySelector(".scan"), [{transform:"translateY(0)"},{transform:"translateY(760px)"}], {duration:Math.min(2200,durationMs-500),delay:startMs+1200,easing:"ease-in-out"});
      }
      if (family === "binary-compare") {
        finiteAnimation(root.querySelector(".panel:first-child"), [{transform:"translateX(-170px)",opacity:0},{transform:"translateX(0)",opacity:1}], {duration:750,delay:startMs+350,easing:"ease-out"});
        finiteAnimation(root.querySelector(".panel.alt"), [{transform:"translateX(170px)",opacity:0},{transform:"translateX(0)",opacity:1}], {duration:750,delay:startMs+480,easing:"ease-out"});
        finiteAnimation(root.querySelector(".neq"), [{transform:"scale(4) rotate(-20deg)",opacity:0},{transform:"scale(1)",opacity:1,offset:.55},{transform:"scale(1.22)",opacity:1},{transform:"scale(1)",opacity:1}], {duration:1600,delay:startMs+1000,easing:"ease-in-out"});
      }
      if (family === "orbit-conclusion") {
        finiteAnimation(root.querySelector(".core"), [{transform:"scale(.2) rotate(-24deg)",opacity:0},{transform:"scale(1)",opacity:1,offset:.55},{transform:"scale(1.05)",opacity:1},{transform:"scale(1)",opacity:1}], {duration:2400,delay:startMs+350,easing:"ease-in-out"});
        animateAll(`#${scene.id} .chip`, [{transform:"scale(.25)",opacity:0},{transform:"scale(1)",opacity:1}], {duration:450,delay:startMs+650,easing:"ease-out"}, 120);
      }
      if (index < plan.scenes.length - 1) {
        const wipe = root.querySelector(".scene-wipe");
        wipe.style.backgroundColor = scene.transition === "orange-wipe" ? "#DF744F" : scene.transition === "green-wipe" ? "#1F5A46" : "#C8E35B";
        finiteAnimation(wipe, [{transform:"translateX(-115%)"},{transform:"translateX(0)",offset:.45},{transform:"translateX(115%)"}], {duration:620,delay:Number(scene.end)*1000-620,easing:"cubic-bezier(.7,0,.3,1)"});
      }
    }

    plan.scenes.forEach((scene, index) => {
      const node = document.createElement("section");
      node.className = `scene clip ${scene.visual_type}`;
      node.id = scene.id;
      node.setAttribute("data-start", String(scene.start));
      node.setAttribute("data-duration", String(Number(scene.end) - Number(scene.start)));
      node.setAttribute("data-track-index", String(index + 1));
      node.setAttribute("data-layout-allow-overlap", "");
      node.setAttribute("data-layout-allow-occlusion", "");
      node.innerHTML = `<div class="content"><div class="top"><span>EVIDENCE IN MOTION</span><span>${String(index+1).padStart(2,"0")} / ${String(plan.scenes.length).padStart(2,"0")}</span></div><div class="kicker">${esc(scene.kicker)}</div><h1>${esc(scene.title)}</h1><div class="visual">${visualMarkup(scene)}</div></div><div class="caption">${esc(scene.caption)}</div><div class="scene-wipe" data-layout-allow-overflow data-layout-allow-occlusion></div>`;
      scenesRoot.appendChild(node);
    });
    plan.scenes.forEach(animateScene);
  </script>
</body>
</html>
